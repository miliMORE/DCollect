{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Staff survey · DCollect{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="icon" href="{% static 'brand/favicon.ico' %}" sizes="any">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="public-survey">
  <header class="public-bar">
    <img src="{% static 'brand/logo.svg' %}" alt="DCollect" width="36" height="36">
    <div>
      <strong>DCollect</strong>
      <div class="tiny">Salary and remuneration review</div>
    </div>
  </header>
  <main class="public-main">
    {% if messages %}
      {% for message in messages %}
        <div class="flash {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
